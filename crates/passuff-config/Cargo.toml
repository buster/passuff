[package]
name = "passuff-config"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "../../README.md"
publish = ["crates-io"]
description = "Configuration model and validation for the passuff GitHub pull request watcher"
keywords = ["github", "pull-requests", "configuration"]
categories = ["config"]

[dependencies]
serde = { version = "1", features = ["derive"] }
thiserror = "2"
toml = "1.1"
url = "2.5"

[dev-dependencies]
tempfile = "3"
