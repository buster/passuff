[package]
name = "passuff-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
test-support = []

[[bin]]
name = "passuff"
path = "src/main.rs"

[[bin]]
name = "passuff-tui"
path = "src/tui_main.rs"

[dependencies]
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.6", features = ["derive"] }
directories = "6"
notify-rust = "4.18"
ratatui = "0.30"
toml_edit = "0.25"
crossterm = "0.29"
passuff-config = { path = "../passuff-config" }
passuff-core = { path = "../passuff-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
cucumber = { version = "0.23", features = ["output-json"] }
futures = "0.3"
regex = "1"
tempfile = "3"
url = "2.5"
wiremock = "0.6"
zbus = "6.2"

[[test]]
name = "features_runner"
path = "tests/features_runner.rs"
harness = false
required-features = ["test-support"]
