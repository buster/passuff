[package]
name = "passuff"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Multi-account GitHub pull request inbox and desktop notifier"

[features]
default = []
test-support = []

[dependencies]
passuff-config.workspace = true
passuff-core.workspace = true
chrono.workspace = true
clap.workspace = true
crossterm.workspace = true
directories.workspace = true
notify-rust.workspace = true
ratatui.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true

[dev-dependencies]
cucumber = "0.23"
tempfile = "3"
tokio.workspace = true

[[bin]]
name = "passuff"
path = "src/main.rs"

[[bin]]
name = "passuff-tui"
path = "src/bin/passuff-tui.rs"

[[test]]
name = "features_runner"
path = "tests/features_runner.rs"
harness = false
