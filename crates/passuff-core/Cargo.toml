[package]
name = "passuff-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "../../README.md"
publish = ["crates-io"]
description = "UI-agnostic GitHub pull request observation and notification core for passuff"
keywords = ["github", "pull-requests", "notifications"]

[dependencies]
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
passuff-config = { path = "../passuff-config", version = "0.1.3" }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["process", "time", "sync", "macros", "rt"] }
tracing = "0.1"
url = "2.5"

[dev-dependencies]
tempfile = "3"

wiremock = "0.6"
