[package]
name = "passuff-e2e"
version = "0.1.3"
edition = "2021"
rust-version = "1.88"
license = "GPL-3.0-or-later"
description = "Black-box acceptance package for the built passuff binaries"
publish = false

# The frozen acceptance authority. It must not depend on passuff,
# passuff-config, or passuff-core: it reaches the product only by executing the
# binaries in PASSUFF_BIN_DIR.
[dev-dependencies]
cucumber = "0.23"
portable-pty = "0.9"
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
vt100 = "0.16"
wiremock = "0.6"

# The package declares its own workspace so it survives a clean room: the
# frozen tree is copied without the repository root. It must never gain a
# dependency on a production crate.
[workspace]

# Same as the production workspace: no debug info, so dependency artifacts are
# shared when both builds use one target directory.
[profile.dev]
debug = 0

[profile.test]
debug = 0

[[test]]
name = "e2e_runner"
path = "tests/e2e_runner.rs"
harness = false
