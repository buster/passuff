[package]
name = "passuff-e2e"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Black-box acceptance package for the built passuff binaries"
publish = false

# The frozen acceptance authority. It must not depend on passuff,
# passuff-config, or passuff-core: it reaches the product only by executing the
# binaries in PASSUFF_BIN_DIR.
[dev-dependencies]
cucumber = "0.23"
portable-pty = "0.9"
serde_json.workspace = true
tempfile = "3"
tokio.workspace = true
vt100 = "0.16"
wiremock = "0.6"

[[test]]
name = "e2e_runner"
path = "tests/e2e_runner.rs"
harness = false
