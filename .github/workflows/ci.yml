name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install dbus for the private notification test bus
        run: sudo apt-get update && sudo apt-get install --no-install-recommends --yes dbus

      - name: Cache Cargo dependencies and build artifacts
        if: github.event_name != 'pull_request'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: passuff-cargo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            passuff-cargo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml') }}-

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check all targets
        run: cargo check --locked --all-targets

      - name: Run Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Run Clippy with the test-support feature
        run: cargo clippy --locked -p passuff --all-targets --features test-support -- -D warnings

      - name: Run library tests
        run: cargo test --locked --workspace --lib

      - name: Run acceptance scenarios
        shell: bash
        run: GIVN_FEATURES="$PWD/givn/specs" ./scripts/verify.sh

      - name: Run end-to-end scenarios
        shell: bash
        run: ./scripts/verify.sh --e2e
