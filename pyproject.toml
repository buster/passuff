[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "passuff"
version = "0.2.0"
description = "Multi-account GitHub pull request inbox and desktop notifier"
requires-python = ">=3.11"
license = { text = "GPL-3.0-or-later" }
dependencies = [
  "httpx",
  "tomlkit",
  "jeepney",
]

[project.optional-dependencies]
test = ["behave", "coverage", "dbus-next"]

[project.scripts]
passuff = "passuff.cli:main"
passuff-tui = "passuff.tui:main"

[tool.setuptools]
packages = ["passuff", "passuff.tui"]
