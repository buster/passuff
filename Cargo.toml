[workspace]
resolver = "2"
members = [
    "crates/passuff-config",
    "crates/passuff-core",
    "crates/passuff-cli",
]
# The frozen acceptance package is supplied outside this rebuild. Excluding it
# lets its manifest build as its own workspace when it is placed under crates/.
exclude = ["crates/passuff-e2e"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "GPL-3.0-or-later"

[workspace.dependencies]
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.8", features = ["derive"] }
crossterm = "0.29.0"
ctrlc = "3.5.2"
directories = "6.0.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
toml = "0.8.23"
ureq = { version = "3.5.2", default-features = false, features = ["rustls", "json"] }
