[workspace]
members = [
    "crates/passuff-config",
    "crates/passuff-core",
    "crates/passuff-cli",
    "crates/passuff-e2e",
]
resolver = "2"

[workspace.package]
version = "0.1.3"
edition = "2021"
rust-version = "1.88"
license = "GPL-3.0-or-later"
authors = ["passuff contributors"]

[workspace.dependencies]
passuff-config = { version = "0.1.3", path = "crates/passuff-config" }
passuff-core = { version = "0.1.3", path = "crates/passuff-core" }
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.6", features = ["derive", "env"] }
crossterm = "0.29"
directories = "6"
notify-rust = "4.18"
ratatui = "0.30"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "signal", "sync"] }
toml = "1"
toml_edit = "0.23"

[profile.dev]
debug = 0

[profile.test]
debug = 0
