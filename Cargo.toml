[workspace]
members = [
    "crates/passuff-config",
    "crates/passuff-core",
    "crates/passuff-cli",
]
resolver = "2"

[workspace.package]
version = "0.1.1"
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/buster/passuff"
homepage = "https://github.com/buster/passuff"

[profile.dev]
debug = 0
incremental = false

[profile.test]
debug = 0
incremental = false
